<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="site.css" />
        <style>
            body   { grid-area: b; background: silver}
            header { grid-area: h; background: orange;}
            nav    { grid-area: n; background: yellow;}
            main   { grid-area: m; background: white;}
            aside  { grid-area: a; background: gray;}
            footer { grid-area: f; background: red;}

            #container { 
                display: grid;
                grid-template-columns: auto;
                grid-template-rows: 100fr 40fr 500fr 90fr 50fr;
                grid-template-areas: 'h'   'n'  'm'  'a'  'f'
            }

            #container > * {
                min-width: 0;
                min-height: 0;
            }

            @media only screen and (min-width: 768px) {
                #container { 
                    max-width: none;
                    margin: auto;
                    grid-template-rows: 100fr 500fr 50fr;
                    grid-template-columns: 25fr 59fr 16fr;
                    grid-template-areas:   'n    h    h' 
                                           'n    m    a' 
                                           'n    f    f'
                }
                
            }
        </style>
    </head>
    <body class="grid-page" data-grid="10">
        <div id="container">
            <header></header>
            <nav></nav>
            <main></main>
            <aside></aside>
            <footer></footer>
        </div>
        <script src="https://cdn.jsdelivr.net/gh/emilhs9/Cosmic-BG@main/cosmicbg.js" defer></script>
        <script src="site.js"></script>
    </body>
</html>
